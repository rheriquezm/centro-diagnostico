services:
  db:
    image: postgres:16-alpine
    container_name: cd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cd_net

  backend:
    build: ./backend
    container_name: cd_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    networks:
      - cd_net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    container_name: cd_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8011}:3000"
    networks:
      - cd_net

  ollama:
    image: ollama/ollama:latest
    container_name: cd_ollama
    restart: unless-stopped
    profiles: ["llm"]
    volumes:
      - cd_ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - cd_net

volumes:
  cd_postgres_data:
  cd_ollama_data:

networks:
  cd_net:
    driver: bridge
